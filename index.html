<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:locale" content="ru_RU">
<meta property="og:site_name" content="FoodHackLab">
<meta property="og:url" content="https://foodhacklab-pitanie.github.io/foodhacklab-myth-detector/">
<meta property="og:title" content="Детектор мифов о питании">
<meta property="og:description" content="10 вопросов о еде и аппетите. Отличишь миф от факта?">
<meta property="og:image" content="https://foodhacklab-pitanie.github.io/foodhacklab-myth-detector/nutrition-cover.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Детектор мифов о питании. Тарелка с курицей, киноа и свежими овощами.">
<meta name="twitter:card" content="summary_large_image">
<title>FoodHackLab: Детектор мифов о питании</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=6">
<script defer src="counter.js"></script>
<script defer src="game.js?v=7"></script>
</head>
<body class="quiz">
<header>
  <div><strong class="brand">🔬 FoodHackLab</strong></div>
  <button id="sound" type="button" aria-label="Звук" aria-pressed="true">🔊</button>
</header>
<main>
  <section id="start" class="panel">
    <span class="tag">10 раундов</span>
    <h1>Детектор мифов о питании</h1>
    <p>Что влияет на аппетит, сытость и пищевые привычки? Отличите факты от мифов.</p>
    <div class="grid section-gap">
      <button type="button" class="mode" data-mode="calm" aria-pressed="true">Разбор<small>Без таймера</small></button>
      <button type="button" class="mode" data-mode="blitz" aria-pressed="false">Блиц<small>15 секунд на раунд</small></button>
    </div>
    <button id="begin" type="button" class="primary full section-gap">Начать игру →</button>
  </section>
  <section id="game" hidden>
    <div class="round-bar">
      <strong id="round"></strong><span id="combo" class="tag" hidden></span>
      <span id="clock" hidden><progress id="timeBar" max="15" value="15" aria-label="Осталось времени"></progress> <span id="seconds"></span></span>
      <strong>Очки <span id="score">0</span></strong>
    </div>
    <div class="quiz-progress" aria-hidden="true"><div id="roundProgress"></div></div>
    <div id="card" class="panel section-gap">
      <span id="category" class="tag"></span>
      <h2 id="question" tabindex="-1"></h2>
      <div id="answers" class="grid">
        <button type="button" id="myth" class="myth">✕ Это миф</button>
        <button type="button" id="fact" class="fact">✓ Это факт</button>
      </div>
      <div id="feedback" hidden>
        <h2 id="verdict" aria-live="polite"></h2><strong id="truth"></strong>
        <p id="explanation"></p>
        <aside class="daily-tip" aria-labelledby="tipLabel"><h3 id="tipLabel">Совет дня</h3><p id="tip"></p></aside>
        
      </div>
    </div>
    <div id="advance" hidden><button id="next" type="button" class="primary full">Следующий вопрос →</button></div>
  </section>
  <section id="result" class="panel" hidden>
    <span class="tag">Ваш результат</span><h2 id="rank"></h2>
    <div id="summary" class="grid"></div>
    <h3>📋 Шпаргалка FoodHackLab</h3>
    <ul id="cheat"></ul>
    <div class="grid section-gap">
      <button id="telegram" type="button">Поделиться в Telegram</button>
      <button id="vk" type="button">Поделиться ВКонтакте</button>
      <button id="copy" type="button">Скопировать результат</button>
      <button id="restart" type="button" class="primary">Пройти игру ещё раз</button>
    </div>
    <p id="copyStatus" role="status"></p>
  </section>
</main>
</body>
</html>
